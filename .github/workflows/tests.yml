# The game needs nothing but a browser, and the suites need nothing but Node --
# no install step, no lockfile, no cache. That is a deliberate property of this
# project (see the "No software, no toolchain" constraint in AGENTS.md), so this
# workflow keeps it: checkout, node, run.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Regression gate, not a perfection gate. This project ships with known
      # failures that predate the checkout; requiring a clean run would make CI
      # permanently red and therefore ignored. tools/ci-check.js fails only when
      # failures rise or tests disappear, and reports improvements so the
      # baseline can be tightened deliberately.
      - name: Suites against the measured baseline
        working-directory: TD_0.5.0
        run: node tools/ci-check.js

      # Three winding bugs turned up during the visual pass and all three were
      # found by eye: the road kerbs, td_mesh.ball and GLGeometry.sphere. With
      # CULL_FACE/BACK an inward winding culls the near surface and shows the
      # inside of the far one, which reads as a shading problem rather than a
      # geometry one. Cheap to test, expensive to spot.
      # Python only so the audit can reach the td_mesh half. Without it the tool
      # degrades to auditing the JS primitives and says so, rather than passing
      # silently on half the surface -- but half an audit is how ball stayed
      # inside out through an entire art pass.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Primitives are wound outward
        working-directory: TD_0.5.0
        env:
          PYTHON: python
        run: node tools/check-winding.js

  models:
    # The generated geometry is only trustworthy if it is reproducible. Every
    # model under js/gl/models/ is emitted by a pure-Python script in
    # tools/blender/ -- no Blender needed for these ones -- so CI rebuilds them
    # and fails if the tree moves. That is what stops a hand-edit to a generated
    # file surviving unnoticed.
    #
    # WINDOWS, and not by preference. The first run of this job failed on ubuntu
    # with about twenty files differing by exactly ONE LINE each. That is not a
    # content change: coordinates come out of math.cos/math.sin, whose last unit
    # in the last place differs between the Windows CRT and glibc, and td_mesh
    # prints through "%g" at six significant figures. A value sitting on a
    # rounding boundary lands on either side of it depending on the libm, so one
    # digit moves in one number in a file of tens of thousands.
    #
    # The art is authored on Windows, so Windows is the reference platform and
    # this job asks the question that actually matters: does re-running the build
    # script reproduce what was committed? Comparing against a different libm
    # asks a subtly different question and answers it wrong.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the td_mesh-authored models
        working-directory: TD_0.5.0/tools/blender
        run: |
          python tower_warbringer.py
          python tower_summoner.py
          python summoner_figure.py
          python summoner_creature.py
          python summoner_unit_marks.py
          python siphon_idol.py
          python siphon_abyss.py
          python siphon_beam.py

      - name: The rebuild must be byte-identical
        shell: bash
        run: |
          # Line endings would otherwise be the whole diff on Windows: git checks
          # out CRLF and Python writes LF, so every file would look rewritten.
          git config core.autocrlf false
          git rm -q --cached -r TD_0.5.0/js/gl/models >/dev/null
          git checkout -- TD_0.5.0/js/gl/models
          if ! git diff --quiet -- TD_0.5.0/js/gl/models; then
            echo "Regenerating the models changed the tree."
            echo "Either a generated file was hand-edited, or a build script is"
            echo "not deterministic. Both matter: the models are the shipped art."
            git diff --stat -- TD_0.5.0/js/gl/models
            exit 1
          fi
          echo "All regenerated models are byte-identical."
