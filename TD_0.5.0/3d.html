<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tower Defense — 3D board</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0c12; overflow: hidden;
               font: 12px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
               color: #b9c4d6; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%;
          display: block; cursor: grab; touch-action: none; }
  #panel { position: absolute; left: 12px; top: 12px; padding: 10px 13px;
           background: rgba(10,13,20,0.82); border: 1px solid #263048;
           border-radius: 8px; pointer-events: none; max-width: 300px; }
  #panel b { color: #e8eef8; font-weight: 500; }
  #panel kbd { background: #1b2436; border: 1px solid #2f3c58; border-radius: 4px;
               padding: 0 5px; color: #cfe0ff; font-family: inherit; }
  #stats { position: absolute; right: 12px; top: 12px; padding: 8px 11px;
           background: rgba(10,13,20,0.82); border: 1px solid #263048;
           border-radius: 8px; white-space: pre; pointer-events: none;
           font-variant-numeric: tabular-nums; }
  #maps { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px;
          flex-wrap: wrap; max-width: 60vw; }
  #maps button { background: #161e2e; color: #b9c4d6; border: 1px solid #2b3852;
                 border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
  #maps button:hover { background: #1e2a40; color: #e8eef8; }
  #maps button[data-on="1"] { background: #26527a; color: #eaf3ff; border-color: #3f7cb0; }
  #err { position: absolute; inset: 0; display: none; place-items: center;
         color: #ff9d9d; padding: 40px; text-align: center; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="panel">
  <b>Camera</b><br>
  <kbd>Middle</kbd> drag — orbit<br>
  <kbd>Right</kbd> drag — pan<br>
  <kbd>Wheel</kbd> — zoom to cursor<br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — pan<br>
  <kbd>R</kbd> — reset view
</div>
<div id="stats">…</div>
<div id="maps"></div>
<div id="err"></div>

<!-- Only what the board needs. game.js is deliberately NOT loaded: it starts a
     loop and owns a 2D canvas, and this page exists to prove the renderer and
     the camera against the real map data without either of those in the way. -->
<script src="js/units.js"></script>
<script src="js/path.js"></script>
<script>
// js/maps.js reads AUTHORED_AT_PX_PER_UL, and that global is declared in
// js/game.js -- which this page deliberately does not load. It is NOT
// re-typed here: game.js documents it as "kept EQUAL to the default
// UNIT_LENGTH", so it is read off units.js at load, before anything can have
// retuned it. One number, one home.
var AUTHORED_AT_PX_PER_UL = UNIT_LENGTH;
</script>
<script src="js/maps.js"></script>

<script src="js/gl/gl-math.js"></script>
<script src="js/gl/gl-renderer.js"></script>
<script src="js/gl/gl-camera.js"></script>
<script src="js/gl/gl-geometry.js"></script>
<script src="js/gl/gl-models.js"></script>

<!-- The models themselves, as source. Each file calls GLModels.register at
     load time; there is no loader and nothing is fetched, which is what lets
     this work from a double-clicked file. -->
<script src="js/gl/models/rifleman-base.js"></script>
<script src="js/gl/models/rifleman-a3.js"></script>
<script src="js/gl/models/rifleman-a5.js"></script>
<script src="js/gl/models/rifleman-b3.js"></script>
<script src="js/gl/models/rifleman-b5.js"></script>
<script src="js/gl/models/recruit-b4.js"></script>
<script src="js/gl/models/recruit-b5.js"></script>
<script src="js/gl/models/enemy-normal.js"></script>
<script src="js/gl/models/enemy-swarm.js"></script>
<script src="js/gl/models/enemy-brute.js"></script>
<script src="js/gl/models/enemy-hive.js"></script>
<script src="js/gl/models/enemy-flying.js"></script>
<script src="js/gl/models/enemy-armored.js"></script>
<script src="js/gl/models/enemy-fast.js"></script>
<script src="js/gl/models/enemy-slow.js"></script>
<script src="js/gl/models/enemy-angry.js"></script>
<script src="js/gl/models/enemy-camo_normal.js"></script>
<script src="js/gl/models/enemy-shielded.js"></script>

<script>
(function () {
  "use strict";

  var canvas = document.getElementById("view");
  var statsEl = document.getElementById("stats");

  var renderer;
  try {
    renderer = new GLRenderer(canvas);
  } catch (e) {
    var err = document.getElementById("err");
    err.style.display = "grid";
    err.textContent = "WebGL could not start.\n\n" + e.message;
    return;
  }

  // Mirrors ROAD_WIDTH_UL in js/game.js. It is passed in rather than imported
  // because loading game.js here would start the game; when the real migration
  // happens the caller hands its own constant over and this literal goes.
  var ROAD_WIDTH_UL = 21.875;

  // Mirrors js/game.js. This page loads maps.js and path.js but NOT game.js --
  // a board viewer has no business pulling in the whole simulation -- so the
  // one constant it needs from there is restated. AGENTS.md pins it EQUAL to
  // the default UNIT_LENGTH, and `Maps.routesOf` already applies it to route
  // points; zones are raw authored coordinates and need it applied here.
  var AUTHORED_PX_PER_UL = 1.04;
  function authored(v) { return ul(v / AUTHORED_PX_PER_UL); }

  // Which zone kinds are FLOOR and which are props. The 2D board draws
  // twenty-three kinds; these four are the ones that change the shape of the
  // ground, and they are what a camera orbiting the board needs to read. The
  // rest are consoles, pylons, crystals and antennae -- real geometry for
  // later, and deliberately not faked as slabs now.
  var ZONE_HEIGHT = {
    deck: 9, bay: 5, hazard: 2.5, "void": -4
  };

  // THE MAPS ALREADY CARRY THEIR OWN COLOURS, so this takes them rather than
  // inventing a seventh scheme. `Maps.ENVIRONMENTS[id].theme` is what the 2D
  // board paints from -- floor, panel, metal, road inner/outer and an accent --
  // and the whole point of six themed ley-lines is that they do not look alike.
  // A hardcoded palette here would have thrown that away and made every map the
  // same slate blue.
  function paletteFor(map) {
    var t = (Maps.themeOf ? Maps.themeOf(map) : null) || {};
    function hex(v, fallback) {
      return GLGeometry.hex(v || fallback);
    }
    // `accent` and `roadEdge` are stored as bare "r,g,b" for rgba() strings.
    function triple(v, fallback) {
      if (!v) return GLGeometry.hex(fallback);
      var p = String(v).split(",");
      return p.length === 3
        ? [+p[0] / 255, +p[1] / 255, +p[2] / 255]
        : GLGeometry.hex(fallback);
    }
    return {
      terrain: hex(t.floor, "#0c2633"),
      terrainEdge: hex(t.panelDark, "#081d29"),
      panel: hex(t.panel, "#123848"),
      metal: hex(t.metal, "#263f4c"),
      metalDark: hex(t.metalDark, "#132733"),
      roadTop: hex(t.roadInner, "#274553"),
      roadSide: hex(t.roadOuter, "#0a1922"),
      marker: triple(t.accent, "#4FE3D2"),
      spawn: GLGeometry.hex("#DE4F54")
    };
  }

  var PALETTE = paletteFor(null);

  var scene = null;
  var camera = null;

  function buildMap(mapId) {
    var map = Maps.byId(mapId);
    var routes = Maps.routesOf(map);
    PALETTE = paletteFor(map);

    // The board's extent, from the routes themselves plus a margin, so the
    // ground is always big enough for whatever a generated map did.
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    routes.forEach(function (r) {
      r.points.forEach(function (p) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      });
    });
    var pad = 260;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;

    var g = new GLGeometry.Builder();
    GLGeometry.ground(g, minX, minY, maxX, maxY, 0, PALETTE.terrain);

    // A faint grid of low slabs. Not decoration: without something repeating
    // on the ground there is no parallax, and an orbit over a flat colour
    // gives the eye nothing to tell it the camera moved at all.
    var step = 200;
    for (var gx = Math.ceil(minX / step) * step; gx < maxX; gx += step) {
      GLGeometry.box(g, gx, (minY + maxY) / 2, 2.5, maxY - minY, 1.2,
        PALETTE.terrainEdge);
    }
    for (var gy = Math.ceil(minY / step) * step; gy < maxY; gy += step) {
      GLGeometry.box(g, (minX + maxX) / 2, gy, maxX - minX, 2.5, 1.2,
        PALETTE.terrainEdge);
    }

    // The map's own floor zones, raised or sunk. These are the decks and bays
    // the 2D board paints, and in 3D they are what stops the ground reading as
    // one flat sheet -- the road is no longer the only thing with edges.
    var env = Maps.ENVIRONMENTS && Maps.ENVIRONMENTS[mapId];
    var zones = (env && env.zones) || [];
    zones.forEach(function (z) {
      var h = ZONE_HEIGHT[z.kind];
      if (h === undefined || !z.w || !z.h) return;
      var w = authored(z.w), d = authored(z.h);
      var cx = authored(z.x) + w / 2, cy = authored(z.y) + d / 2;
      // A sunk zone is drawn as a thin lip rather than a hole: this renderer
      // has no CSG, and a negative box would z-fight the ground it sits in.
      var top = h < 0 ? PALETTE.terrainEdge : PALETTE.panel;
      GLGeometry.box(g, cx, cy, w, d, Math.max(1.5, Math.abs(h)), top,
        h < 0 ? -0.2 : 0.4);
      // A rim, so an orbit reads the edge from every angle instead of only
      // where the sun happens to catch it.
      GLGeometry.box(g, cx, cy, w + 7, d + 7, 1.4, PALETTE.metalDark,
        h < 0 ? 0 : Math.abs(h) * 0.9);
    });

    var roadWidth = ul(ROAD_WIDTH_UL);
    var paths = [];
    routes.forEach(function (r) {
      GLGeometry.road(g, r.points, roadWidth, 7, PALETTE.roadTop,
        PALETTE.roadSide);
      paths.push(new GamePath(r.points));
      var first = r.points[0], last = r.points[r.points.length - 1];
      GLGeometry.box(g, first.x, first.y, 34, 34, 26, PALETTE.spawn);
      GLGeometry.box(g, last.x, last.y, 40, 40, 8, PALETTE.marker);
    });

    // Stand-in towers, so there is something with HEIGHT to orbit around --
    // a flat board gives the eye nothing to judge perspective or parallax by.
    //
    // Placed by walking the route and stepping sideways off it, rather than
    // through `Maps.bestSpots`: that helper rates ground for a real tower type
    // and reaches into the tower classes, which this page does not load. The
    // real board will use bestSpots; a viewer does not need to.
    // WHERE THE ACTORS GO. The map geometry above is baked into one static
    // mesh; these are instances placed per frame, so they are collected as
    // positions rather than as triangles.
    var actors = [];
    var towerModels = ["rifleman-base", "rifleman-a3", "rifleman-b3",
                       "rifleman-a5", "rifleman-b5"];
    paths.forEach(function (p) {
      var gap = roadWidth * 1.5;
      var n = 0;
      for (var d = p.length * 0.08; d < p.length; d += p.length / 7, n++) {
        var at = p.pointAt(d);
        var t = p.tangentAt(d);
        var tl = Math.hypot(t.x, t.y) || 1;
        var side = (n % 2) ? 1 : -1;
        var x = at.x + (-t.y / tl) * gap * side;
        var y = at.y + (t.x / tl) * gap * side;
        // A pad under each one, so a tower reads as PLACED rather than as
        // standing loose on the floor -- the same job Visuals3Q.platform does
        // in 2D.
        GLGeometry.box(g, x, y, 30, 30, 3, PALETTE.metalDark);
        actors.push({
          model: towerModels[n % towerModels.length], x: x, y: y,
          // Face across the road, which is where the traffic is.
          yaw: Math.atan2(t.y, t.x) - Math.PI / 2 * side
        });
      }
      // Some traffic on the road itself, so the scale of a person against the
      // board is judgeable.
      var enemyModels = ["enemy-normal", "enemy-swarm", "enemy-brute",
                         "enemy-hive", "enemy-flying"];
      for (var e = 0; e < 8; e++) {
        var ed = p.length * (0.10 + e * 0.105);
        var ep = p.pointAt(ed), et = p.tangentAt(ed);
        actors.push({
          model: enemyModels[e % enemyModels.length], x: ep.x, y: ep.y,
          yaw: Math.atan2(et.y, et.x)
        });
      }
    });

    return {
      id: mapId,
      actors: actors,
      mesh: g.build(renderer),
      tris: g.count() / 3,
      bounds: { minX: minX, minY: minY, maxX: maxX, maxY: maxY },
      centre: [(minX + maxX) / 2, (minY + maxY) / 2],
      span: Math.max(maxX - minX, maxY - minY),
      paths: paths
    };
  }

  function load(mapId) {
    scene = buildMap(mapId);
    var b = scene.bounds;
    if (!camera) {
      camera = new OrbitCamera(canvas, {
        target: [scene.centre[0], scene.centre[1], 0],
        distance: scene.span * 1.05,
        minDistance: 180,
        maxDistance: scene.span * 2.2
      });
    }
    camera.bounds = {
      minX: b.minX, maxX: b.maxX, minY: b.minY, maxY: b.maxY
    };
    camera.maxDistance = scene.span * 2.2;
    reset();
    [].forEach.call(document.querySelectorAll("#maps button"), function (btn) {
      btn.setAttribute("data-on", btn.dataset.id === mapId ? "1" : "0");
    });
  }

  function reset() {
    // Open on the angle the 2D board has always been drawn at, so the very
    // first frame of the 3D build is recognisably the same game.
    camera.wantYaw = -Math.PI / 2;
    camera.yaw = camera.wantYaw;
    camera.wantPitch = 34.06 * Math.PI / 180;
    camera.pitch = camera.wantPitch;
    var b = scene.bounds;
    camera.wantDistance = camera.fitBounds(b.minX, b.minY, b.maxX, b.maxY);
  }

  // A debug handle, and the only global this page exports. The camera is the
  // thing that has to be TESTED rather than eyeballed -- a 1:1 pan and a
  // zoom-to-cursor are exact numeric properties, not matters of taste -- and a
  // closure with no handle cannot be asserted against.
  window.TD3D = {
    camera: function () { return camera; },
    scene: function () { return scene; },
    load: load,
    reset: reset
  };

  var buttons = document.getElementById("maps");
  ["rune-circuit", "mana-coil", "sigil-lattice", "null-meridian",
   "shifting-ley", "twin-confluence"].forEach(function (id) {
    var b = document.createElement("button");
    b.textContent = id;
    b.dataset.id = id;
    b.addEventListener("click", function () { load(id); });
    buttons.appendChild(b);
  });

  window.addEventListener("keydown", function (e) {
    if (e.key.toLowerCase() === "r") reset();
  });

  load("rune-circuit");

  var last = 0, fpsAvg = 0;
  function frame(now) {
    var dt = last ? Math.min(0.1, (now - last) / 1000) : 0;
    last = now;

    renderer.resize();
    camera.update(dt);
    renderer.begin(camera.viewProjection());
    renderer.draw(scene.mesh, 0, 0, 0, 0, 1);

    // The actors. `unitsToPx` is baked into each exported model by the
    // exporter, so a Blender unit is the same number of board pixels here as
    // it is in the 2D sprite pack -- a Rifleman is the same height on both
    // boards, and neither file has to know the other's numbers.
    var drawn = 0;
    for (var i = 0; i < scene.actors.length; i++) {
      var a = scene.actors[i];
      var mesh = GLModels.mesh(renderer, a.model);
      if (!mesh) continue;
      renderer.draw(mesh, a.x, a.y, 0, a.yaw, mesh.unitsToPx);
      drawn += mesh.triangles;
    }
    scene.actorTris = drawn;

    if (dt > 0) fpsAvg = fpsAvg ? fpsAvg * 0.92 + (1 / dt) * 0.08 : 1 / dt;
    statsEl.textContent =
      "map      " + scene.id + "\n" +
      "triangles " + scene.tris.toFixed(0) + "\n" +
      "fps       " + fpsAvg.toFixed(0) + "\n" +
      "yaw       " + (camera.yaw * 180 / Math.PI).toFixed(0) + "°\n" +
      "pitch     " + (camera.pitch * 180 / Math.PI).toFixed(0) + "°\n" +
      "distance  " + camera.distance.toFixed(0);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Exposed so the browser tools can drive the camera without a real mouse.
  window.TD3D = { camera: function () { return camera; },
                  scene: function () { return scene; },
                  renderer: renderer, reset: reset, load: load };
})();
</script>
</body>
</html>
